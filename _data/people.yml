# STAFF CARDS on the home page. The instructor comes first, then the head TA
# (any role containing "Head"), then the other TAs in the order listed.
# Every card links to the person's email.
#
# Full example:
#
#   instructor:
#     name: "Maryam Ramezani"
#     role: "Instructor"
#     title: "Assistant Professor"      # optional; second line under the role
#     email: "name@sharif.edu"          # optional; the card becomes a mailto: link
#     office: "CE821"                   # optional
#     office_hours: "Sun 10:00-12:00"   # optional
#     photo: "/assets/images/people/ramezani.jpg"   # optional; initials are shown without it
#
#   tas:
#     - name: "Erfan Yeganegi"
#       role: "Head Teaching Assistant"
#       email: "name@example.com"
#       photo: "/assets/images/people/yeganegi.jpg"

