#
# Full example of each kind of entry:
#
#   teaching_days: "Saturdays & Mondays"     # shown in the home page header
#
#   topics:                                  # one entry per lecture topic
#     - topic_order: 4                       # matches `order` in _lectures/04.md
#       dates:                               # one date per session of that topic
#         - "2026-11-09"
#         - "2026-11-14"                     # a second date = a two-session topic
#
#   coursework:                              # homework and projects
#     - slug: "theory-1"                     # matches `slug` in _data/coursework.yml
#       release: "2026-10-31"                # shown as "Release" on the timeline
#       due: "2026-11-14"                    # shown as "Deadline" and on the card
#
#   exams:
#     - slug: "midterm-exam"                 # matches the file name in _exams/
#       date: "2026-12-02"                   # shown on the timeline and the exam card
