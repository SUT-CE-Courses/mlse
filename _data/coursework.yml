# HOMEWORK AND PROJECT CARDS on the Homework & Exams page.
# Dates come from _data/course_plan.yml (matched by `slug`).
#
# Full example:
#
#   - title: "Theory Homework 1"        # card title
#     order: 1                          # card order
#     kind: "Theory"                    # small label above the title
#     slug: "theory-1"                  # must match the slug in course_plan.yml
#     tag: "TH1"                        # large faded label behind the card
#     topic: "Data pipelines and feature engineering"   # one line under the title

- title: "Homework I"
